services:
  influxdb:
    image: influxdb:2.7.0
    ports:
      - "127.0.0.1:8087:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: benchmark
      DOCKER_INFLUXDB_INIT_PASSWORD: benchmarkpassword
      DOCKER_INFLUXDB_INIT_ORG: benchmark
      DOCKER_INFLUXDB_INIT_BUCKET: benchmark
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: benchmark-token-change-me
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
    volumes:
      - influxdb-data:/var/lib/influxdb2

volumes:
  influxdb-data:
